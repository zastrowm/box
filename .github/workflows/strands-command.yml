name: Strands Command Handler

# Processes `/strands` comments on issues and PRs, and is dispatched by
# auto-strands-review.yml for automatic PR review. The agents (reviewer,
# implementer, refiner, ...) are SOPs in strands-agents/devtools, selected by
# the keyword after `/strands`. Runs the agent read-only, then applies its
# deferred writes in a separate finalize job.
#
# Requires two repo secrets: AWS_ROLE_ARN (a GitHub OIDC role) and
# AGENT_SESSIONS_BUCKET (an S3 bucket for agent session storage). Bedrock model
# access must be enabled in us-west-2 for the role.
#
# Two optional repo variables pick the agent's model and reasoning effort:
# STRANDS_MODEL_ID (a Bedrock model or inference profile ID that the role can
# invoke) and STRANDS_REASONING_EFFORT (low, medium, high, or max). Unset gives
# the runner default.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_id:
        description: 'Issue ID to process (can be issue or PR number)'
        required: true
        type: string
      command:
        description: 'Strands command to execute'
        required: false
        type: string
        default: ''
      session_id:
        description: 'Optional session ID to use'
        required: false
        type: string
        default: ''
      # auto-strands-review.yml passes the exact commit the pull_request event
      # fired on, so the dispatched run pins it instead of re-resolving live
      # HEAD. Empty on a manual dispatch or a /strands comment.
      head_sha:
        description: 'PR head SHA to pin (from the triggering pull_request event)'
        required: false
        type: string
        default: ''
      head_repo:
        description: 'PR head repository (owner/name) for fork checkouts'
        required: false
        type: string
        default: ''
      head_ref:
        description: 'PR head branch name'
        required: false
        type: string
        default: ''

jobs:
  authorization-check:
    if: startsWith(github.event.comment.body, '/strands') || github.event_name == 'workflow_dispatch'
    name: Check access
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      approval-env: ${{ steps.auth.outputs.approval-env }}
      # Head resolved once here so downstream jobs act on the same commit the
      # command was issued against.
      head-sha: ${{ steps.auth.outputs.head-sha }}
      head-repo: ${{ steps.auth.outputs.head-repo }}
      head-ref: ${{ steps.auth.outputs.head-ref }}
    steps:
      - name: Check Authorization
        id: auth
        uses: strands-agents/devtools/authorization-check@main
        with:
          skip-check: ${{ github.event_name == 'workflow_dispatch' }}
          username: ${{ github.event.comment.user.login || 'invalid' }}
          allowed-roles: 'maintain,triage,write,admin'
          issue-id: ${{ inputs.issue_id || github.event.issue.number }}

  setup-and-process:
    needs: [authorization-check]
    environment:
      name: ${{ needs.authorization-check.outputs.approval-env }}
      deployment: false
    permissions:
      # Needed to create a branch for the Implementer Agent.
      contents: write
      # Both needed to add the `strands-running` label to issues and PRs.
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # The reviewer prompt comes from the commit this workflow runs from (the
      # default branch for a comment, the dispatched ref for a dispatch), never
      # from the pull request head, so a pull request cannot rewrite the prompt
      # that reviews it.
      - name: Check out the reviewer prompt
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: trusted-prompt
          persist-credentials: false
          sparse-checkout: .github/strands/reviewer-system-prompt.md
          sparse-checkout-cone-mode: false

      - name: Read the reviewer prompt
        id: prompt
        run: |
          delimiter="PROMPT_$(openssl rand -hex 16)"
          {
            echo "suffix<<$delimiter"
            cat trusted-prompt/.github/strands/reviewer-system-prompt.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Parse input
        id: parse
        uses: strands-agents/devtools/strands-command/actions/strands-input-parser@main
        with:
          issue_id: ${{ inputs.issue_id }}
          command: ${{ inputs.command }}
          session_id: ${{ inputs.session_id }}
          # Appended to the system prompt of every mode; the file itself limits
          # its instructions to the reviewer.
          system_prompt_suffix: ${{ steps.prompt.outputs.suffix }}
          # Auto-review supplies the event SHA via inputs.head_sha; a /strands
          # comment leaves it empty and uses the head resolved by the
          # authorization job. Either way the parser uses that commit instead of
          # re-resolving live HEAD.
          head_sha: ${{ inputs.head_sha || needs.authorization-check.outputs.head-sha }}
          head_repo: ${{ inputs.head_repo || needs.authorization-check.outputs.head-repo }}
          head_ref: ${{ inputs.head_ref || needs.authorization-check.outputs.head-ref }}

  # Builds strands-box from the commit the agent will check out, so the agent
  # finds it on PATH instead of building it. This compiles untrusted PR code,
  # so it holds a read-only token, no secrets, no OIDC, and never saves the
  # cargo cache. The binaries are aarch64 because Linux containment is
  # aarch64-only; the agent job runs on the same runner for that reason.
  build-box:
    needs: [setup-and-process]
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      # Same values as containment-deterministic.yml, so the cache key matches
      # the cache that a push to main saves there.
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C debuginfo=0"
    outputs:
      built: ${{ steps.build.outcome == 'success' }}
    steps:
      - name: Download parsed input artifact
        uses: actions/download-artifact@v4
        with:
          name: strands-parsed-input
          path: ${{ runner.temp }}/parsed-input

      - name: Read the commit to build
        id: target
        run: |
          input="$RUNNER_TEMP/parsed-input/strands-parsed-input.json"
          {
            echo "ref=$(jq -r '.branch_name // ""' "$input")"
            echo "head_sha=$(jq -r '.head_sha // ""' "$input")"
            echo "head_repo=$(jq -r '.head_repo // ""' "$input")"
          } >> "$GITHUB_OUTPUT"

      # The same ref and repository the agent runner checks out.
      - name: Checkout the commit under review
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.head_sha || steps.target.outputs.ref }}
          repository: ${{ steps.target.outputs.head_repo || github.repository }}
          persist-credentials: false

      - name: Verify checkout SHA
        if: steps.target.outputs.head_sha != ''
        env:
          EXPECTED: ${{ steps.target.outputs.head_sha }}
        run: |
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::Checkout SHA mismatch: expected $EXPECTED, got $actual"
            exit 1
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: containment-deterministic
          # Restore only. A cache written from PR code would reach main's builds.
          save-if: false
          workspaces: |
            .
            test-integ

      # A PR that does not compile still needs a review, so a failed build lets
      # the agent run without the binaries.
      - name: Build strands-box and the containment trampoline
        id: build
        continue-on-error: true
        run: cargo build -p strands-box -p strands-box-containment --release --locked

      - name: Upload strands-box binaries
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: strands-box-bin
          path: |
            target/release/strands-box
            target/release/strands-box-sock-alias
            target/release/strands-box-contain-trampoline
          if-no-files-found: error
          retention-days: 1

  execute-readonly-agent:
    needs: [setup-and-process, build-box]
    # Runs when build-box fails, so a PR that does not build still gets a review.
    if: ${{ !cancelled() && needs.setup-and-process.result == 'success' }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write # Required for OIDC
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      # Outside the workspace, because the runner checks out the repository
      # there and replaces it.
      - name: Download strands-box binaries
        if: needs.build-box.outputs.built == 'true'
        uses: actions/download-artifact@v4
        with:
          name: strands-box-bin
          path: ${{ runner.temp }}/strands-box-bin

      - name: Put strands-box on PATH
        if: needs.build-box.outputs.built == 'true'
        run: |
          bin="$RUNNER_TEMP/strands-box-bin"
          chmod +x "$bin"/*
          echo "$bin" >> "$GITHUB_PATH"

      - name: Check strands-box
        env:
          BUILT: ${{ needs.build-box.outputs.built }}
        run: |
          if [ "$BUILT" != 'true' ]; then
            echo "::warning::strands-box did not build; the agent runs without it"
            exit 0
          fi
          command -v strands-box
          strands-box --version

      - name: Run Strands Agent
        id: agent-runner
        # Temporary preview pin: the devtools fork branch that adds model_id and
        # reasoning_effort. Point it back at strands-agents/devtools before upstream.
        uses: zastrowm/devtools/strands-command/actions/strands-agent-runner@configurable-model-effort
        with:
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          sessions_bucket: ${{ secrets.AGENT_SESSIONS_BUCKET }}
          write_permission: 'false'
          # Repo variables, so a maintainer can change the model or effort without
          # a commit. Unset gives the runner default.
          model_id: ${{ vars.STRANDS_MODEL_ID }}
          reasoning_effort: ${{ vars.STRANDS_REASONING_EFFORT }}

  finalize:
    if: always() && (startsWith(github.event.comment.body, '/strands') || github.event_name == 'workflow_dispatch')
    needs: [setup-and-process, execute-readonly-agent]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Execute write operations
        uses: strands-agents/devtools/strands-command/actions/strands-finalize@main
